<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Our Advertisers | Brandmark Kenya</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{font-family:Inter,Arial,sans-serif;background:#f8f8f8}
.h{background:#000;color:#fff;padding:14px 4vw;display:flex;justify-content:space-between;align-items:center}
.h b{color:#00e5ff}.btn{background:#111;color:#fff;padding:8px 16px;border-radius:8px;text-decoration:none;font-size:14px;border:1px solid #333}.btn-p{background:#00e5ff;color:#000;font-weight:700}
.wrap{max-width:1100px;margin:auto;padding:40px 4vw}h1{text-align:center;font-size:36px}.sub{text-align:center;color:#777;margin:10px 0 30px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.card{background:#fff;border-radius:16px;overflow:hidden;border:1px solid #e5e5e5}.card img{width:100%;height:190px;object-fit:cover;background:#eee}
.card-body{padding:16px}.badge{background:#00e5ff;font-size:10px;font-weight:800;padding:3px 8px;border-radius:4px}
.free{border:2px dashed #bbb;background:#fff;border-radius:16px;padding:30px;text-align:center}
</style>
</head>
<body>
<div class="h"><div><b>BRANDMARK</b> KENYA</div><div style="display:flex;gap:10px"><a class="btn" href="/">Home</a><a class="btn btn-p" href="mailto:info@brandmarkenya.com?subject=Book Slot KSh 500">Book Slot</a></div></div>
<div class="wrap">
<h1>Our Advertisers</h1>
<p class="sub" id="slotInfo"></p>
<div class="grid" id="grid"></div>
<div style="text-align:center;margin-top:40px;color:#999;font-size:13px">© 2026 Brandmark Systems Ltd | info@brandmarkenya.com<br><br><a href="/" style="color:#00a8b8;text-decoration:none">← Back to Home</a></div>
</div>

<script src="/advertise/data.js"></script>
<script>
const TOTAL = 6;
const taken = advertisers.length;
const free = TOTAL - taken;
document.getElementById('slotInfo').innerHTML = `${taken} slots taken • ${free} slots available — Get featured today from <strong style="color:#000">KSh 500/month</strong>`;

let h = '';
advertisers.forEach(ad=>{
  if(ad.status !== 'TAKEN') return;
  h += `<div class="card">
    <a href="${ad.page}"><img src="${ad.banner}" alt="${ad.name}" onerror="this.src='https://via.placeholder.com/400x200?text='+encodeURIComponent(ad.name)"></a>
    <div class="card-body">
      <span class="badge">FEATURED</span>
      <h3 style="margin:8px 0 4px">${ad.name}</h3>
      <p style="color:#666;font-size:13px">${ad.category}</p>
      <a href="${ad.page}" style="color:#0097a7;font-weight:700;text-decoration:none;font-size:14px">View Profile →</a>
    </div>
  </div>`;
});
for(let i=0;i<free;i++){
  h += `<div class="free"><h3>Advertise Here</h3><p style="color:#888;font-size:13px;margin:8px 0 14px">Your banner here<br>From KSh 500/month</p><a class="btn btn-p" href="mailto:info@brandmarkenya.com?subject=Book Slot ${i+1} KSh 500">Book This Slot</a></div>`;
}
document.getElementById('grid').innerHTML = h;
</script>
</body>
</html>
