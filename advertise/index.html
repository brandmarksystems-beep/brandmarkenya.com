<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Our Advertisers | Brandmark Kenya</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,Arial,sans-serif;background:#f8f8f8;color:#111}
.h{background:#000;color:#fff;padding:14px 4vw;display:flex;justify-content:space-between;align-items:center}
.h b{color:#00e5ff}
.btn{background:#111;color:#fff;padding:10px 18px;border-radius:10px;text-decoration:none;font-size:14px;border:1px solid #333;cursor:pointer;display:inline-block}
.btn-p{background:#00e5ff;color:#000;font-weight:800;border-color:#00e5ff}
.wrap{max-width:1100px;margin:auto;padding:40px 4vw}
h1{text-align:center;font-size:clamp(28px,4vw,40px)}
.sub{text-align:center;color:#777;margin:10px 0 30px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.card{background:#fff;border-radius:16px;overflow:hidden;border:1px solid #e5e5e5;transition:.2s}
.card:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,0,0,.08)}
.card img{width:100%;height:190px;object-fit:cover;background:#eee}
.card-body{padding:16px}
.badge{background:#00e5ff;font-size:10px;font-weight:800;padding:4px 8px;border-radius:4px;letter-spacing:.05em}
.free{border:2px dashed #bbb;background:#fff;border-radius:16px;padding:32px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}
/* Modal */
#bookModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:99999;align-items:center;justify-content:center;padding:5vw}
#bookBox{background:#fff;border-radius:20px;max-width:380px;width:100%;padding:24px;position:relative}
.m-opt{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;text-decoration:none;font-weight:700;margin-bottom:10px;font-size:15px}
</style>
</head>
<body>
<div class="h">
  <div><b>BRANDMARK</b> KENYA</div>
  <div style="display:flex;gap:10px">
    <a class="btn" href="/">Home</a>
    <a class="btn btn-p" onclick="openBook('General Slot')">Book Slot</a>
  </div>
</div>

<div class="wrap">
  <h1>Our Advertisers</h1>
  <p class="sub" id="slotInfo">Loading...</p>
  <div class="grid" id="grid"></div>
  <div style="text-align:center;margin-top:40px;color:#999;font-size:13px">
    © 2026 Brandmark Systems Ltd | info@brandmarkenya.com<br><br>
    <a href="/" style="color:#0097a7;text-decoration:none">← Back to Home</a>
  </div>
</div>

<!-- BOOKING CHOOSER -->

    <h3 style="font-size:20px">Book <span id="slotName">Slot</span></h3>
    <p style="color:#666;font-size:13px;margin:6px 0 20px">From <b style="color:#000">KSh 500/month</b> • Choose how to contact us:</p>

    <a id="mailLink" class="m-opt" href="#" style="background:#f2f2f2;color:#000">📧 Email Us</a>
